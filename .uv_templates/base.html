<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link href="{{ url_for('static', path='/vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', path='/vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>

    <link rel="shortcut icon" href="{{ url_for('static', path='/media/favicon.ico') }}">
    <link href="{{ url_for('static', path='/css/base.css') }}" rel="stylesheet">


    <title>OFL</title>

    {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg">
        <div class="container">
        <a class="navbar-brand" href="/">
          <img src="{{ url_for('static', path='/media/ofl_dark.png') }}" alt="" width="50">
            Open Flight Log
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
         <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/flights">Flights</a>
              </li>
            </ul>
         </div>
        </div>
    </nav>

    <div class="container">
        <br>
            {% block body %}{% endblock %}
        <br>
    </div>

</body>
</html>
